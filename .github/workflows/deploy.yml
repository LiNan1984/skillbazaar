name: Deploy to server

# 手动触发部署（workflow_dispatch）。服务器 SSH 从本机不可达时，用 GitHub runner 作为跳板。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署的分支'
        required: true
        default: 'feat/skill-zip-download'
      path:
        description: '服务器上的仓库路径（留空自动探测）'
        required: false
        default: ''
      reset_hard:
        description: '是否 git reset --hard 丢弃服务器上的本地改动（yes/no）'
        required: true
        default: 'no'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          fingerprint: ''
          command_timeout: 15m
          script: |
            set -eux

            BRANCH="${{ inputs.branch }}"
            GIVEN_PATH="${{ inputs.path }}"
            RESET_HARD="${{ inputs.reset_hard }}"

            # ---------- 1. 定位仓库 ----------
            if [ -n "$GIVEN_PATH" ]; then
              DIR="$GIVEN_PATH"
            else
              DIR=""
              for d in /opt/skillbazaar /root/skillbazaar /root/sbz /srv/skillbazaar /var/www/skillbazaar /home/*/skillbazaar; do
                if [ -d "$d/.git" ] && [ -f "$d/backend/main.py" ]; then DIR="$d"; break; fi
              done
              if [ -z "$DIR" ]; then
                DIR=$(find / -maxdepth 5 -type d -name skillbazaar 2>/dev/null \
                      | while read -r d; do [ -f "$d/backend/main.py" ] && [ -d "$d/.git" ] && echo "$d" && break; done \
                      | head -1)
              fi
            fi
            if [ -z "$DIR" ] || [ ! -d "$DIR/.git" ]; then
              echo "::error::未在服务器上找到 skillbazaar 仓库，请用 path 输入项指定"
              exit 10
            fi
            echo "==> 仓库路径: $DIR"
            # 仓库属主可能与登录用户不同，先解除 git 的 safe.directory 保护
            export DIR
            git config --global --add safe.directory "$DIR" || true
            cd "$DIR"

            # ---------- 2. 记录当前状态（便于回滚） ----------
            git log --oneline -1 || true
            git status --porcelain | head -20 || true

            # ---------- 3. 备份数据库 ----------
            for db in frontend/skillbazaar.db backend/skillbazaar.db; do
              if [ -f "$db" ]; then
                cp "$db" "$db.bak.$(date +%Y%m%d%H%M%S)"
                echo "==> 已备份 $db"
              fi
            done

            # ---------- 4. 更新代码（先备份，再对齐到 origin） ----------
            STAMP=$(date +%Y%m%d%H%M%S)
            echo "==> 备份工作区到 /root/skillbazaar-pre-deploy-$STAMP.tar.gz"
            tar czf "/root/skillbazaar-pre-deploy-$STAMP.tar.gz" \
              --exclude=node_modules --exclude=.git --exclude='*.db.bak.*' -C "$DIR" . || true

            # 记录本地改动，便于部署后人工核对是否丢失了服务器专属修改
            git diff > "/root/skillbazaar-local-changes-$STAMP.patch" 2>/dev/null || true
            git status --porcelain > "/root/skillbazaar-status-$STAMP.txt" || true
            echo "==> 本地改动条数: $(wc -l < /root/skillbazaar-local-changes-$STAMP.patch) / 状态条目: $(wc -l < /root/skillbazaar-status-$STAMP.txt)"
            head -30 "/root/skillbazaar-status-$STAMP.txt" || true

            git fetch origin "$BRANCH"

            # 只把「未跟踪且与上游同名」的文件移开（不删除），避免 reset 被拒
            # core.quotePath=false：中文文件名不转义，否则后续 mv 会因引号对不上而失败
            git -c core.quotePath=false ls-tree -r --name-only "origin/$BRANCH" | sort > /tmp/upstream_files.txt
            git -c core.quotePath=false ls-files --others --exclude-standard | sort > /tmp/untracked_files.txt
            comm -12 /tmp/untracked_files.txt /tmp/upstream_files.txt > /tmp/conflicts.txt || true
            if [ -s /tmp/conflicts.txt ]; then
              echo "==> 移开的冲突未跟踪文件:"
              cat /tmp/conflicts.txt
              while read -r f; do
                [ -n "$f" ] && mv "$f" "$f.server-bak-$STAMP"
              done < /tmp/conflicts.txt
            fi

            # 丢弃对已跟踪文件的本地修改（已记录在 patch 与 tar 备份中）
            git checkout -- . || true
            git reset --hard "origin/$BRANCH"
            git log --oneline -1

            # ---------- 5. 构建前端 ----------
            cd "$DIR/frontend"
            npm ci
            npm run build
            cd "$DIR"

            # ---------- 5b. 同步前端产物到 nginx 伺服目录 ----------
            # nginx root 是 /var/www/<域名>/dist，不是仓库里的 frontend/dist
            NGINX_CONF=""
            for c in /etc/nginx/sites-available/skillbazaar /etc/nginx/sites-available/skillbazaar.harness-agent.app; do
              [ -f "$c" ] && NGINX_CONF="$c" && break
            done
            WEBROOT=$(grep -oE 'root[[:space:]]+[^;]+;' "$NGINX_CONF" 2>/dev/null | head -1 | sed -E 's/root[[:space:]]+//; s/;[[:space:]]*$//' || true)
            if [ -z "$WEBROOT" ]; then
              WEBROOT="/var/www/skillbazaar.harness-agent.app/dist"
              echo "==> 未从 nginx 读到 root，使用默认: $WEBROOT"
            else
              echo "==> nginx root: $WEBROOT"
            fi
            mkdir -p "$WEBROOT"
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "$DIR/frontend/dist/" "$WEBROOT/"
            else
              find "$WEBROOT" -mindepth 1 -delete
              cp -a "$DIR/frontend/dist/." "$WEBROOT/"
            fi
            echo "==> 伺服目录内容:"
            ls -la "$WEBROOT" | head -8
            echo "==> 伺服 index.html 引用的 bundle:"
            grep -oE '/assets/index-[^"]*\.js' "$WEBROOT/index.html" 2>/dev/null | head -2

            # ---------- 6. 后端依赖 ----------
            cd "$DIR/backend"
            python3 -m pip install -q --break-system-packages -r requirements.txt || true
            cd "$DIR"

            # ---------- 7. 重启后端 ----------
            # systemd → pm2（按工作目录匹配应用名）→ docker → 裸 uvicorn
            UNIT=""
            for u in skillbazaar bazaar skillbazaar-backend skillbazaar-api skillbazaar-web; do
              if systemctl list-unit-files 2>/dev/null | grep -q "^${u}\.service"; then UNIT="$u"; break; fi
            done

            if [ -n "$UNIT" ]; then
              echo "==> systemd 重启: $UNIT"
              systemctl restart "$UNIT"
            elif command -v pm2 >/dev/null 2>&1; then
              echo "==> pm2 应用列表:"
              pm2 list --no-color || true
              # 按 cwd / 入口路径匹配应用名，不猜名字
              PM2_APP=$(pm2 jlist 2>/dev/null | DIR="$DIR" python3 -c '
            import json, os, sys
            target = os.environ.get("DIR", "")
            try:
                apps = json.load(sys.stdin)
            except Exception:
                apps = []
            for a in apps:
                env = a.get("pm2_env", {})
                cwd = env.get("cwd") or ""
                exe = env.get("pm_exec_path") or ""
                if target and (target in cwd or target in exe):
                    print(a.get("name", ""))
                    break
            ')
              if [ -n "$PM2_APP" ]; then
                echo "==> pm2 重启: $PM2_APP"
                pm2 restart "$PM2_APP" --update-env
                pm2 save || true
              else
                echo "==> pm2 中未找到匹配应用，回退到裸 uvicorn"
                pkill -f 'uvicorn main:app' || true
                sleep 2
                (cd "$DIR/backend" && nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /var/log/skillbazaar.log 2>&1 &)
              fi
            elif docker ps --format '{{.Names}}' 2>/dev/null | grep -qi skillbazaar; then
              echo "==> docker 重启"
              docker restart "$(docker ps --format '{{.Names}}' | grep -i skillbazaar | head -1)"
            else
              echo "==> 未识别到 systemd/pm2/docker，按裸 uvicorn 进程重启"
              pkill -f 'uvicorn main:app' || true
              sleep 2
              (cd "$DIR/backend" && nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /var/log/skillbazaar.log 2>&1 &)
            fi

            # ---------- 8. 健康检查（自动探测端口） ----------
            # 后端端口从 nginx 的 proxy_pass 推导，退化为逐端口探测
            PORT=$(grep -oE 'proxy_pass http://127\.0\.0\.1:[0-9]+/api/' "$NGINX_CONF" 2>/dev/null | grep -oE '[0-9]+' | head -1)
            if [ -z "$PORT" ]; then
              for p in 8000 8001 8002 8003 8004 8080 8888; do
                if curl -fsS "http://127.0.0.1:$p/health" >/dev/null 2>&1; then PORT="$p"; break; fi
              done
            fi
            if [ -z "$PORT" ]; then
              echo "::error::健康检查未通过（已探测 8000-8004/8080/8888）"
              echo "==> pm2 状态:"
              pm2 list --no-color || true
              echo "==> 目标应用日志:"
              pm2 logs "${PM2_APP:-skillbazaar-backend}" --nostream --lines 60 2>/dev/null || true
              tail -60 /var/log/skillbazaar.log 2>/dev/null || true
              exit 12
            fi
            echo "==> 健康检查通过，端口 $PORT"
            curl -fsS "http://127.0.0.1:$PORT/health" || true
            echo

            # ---------- 9. 验证下载端点存在 ----------
            curl -fsS -o /dev/null -w "download endpoint HTTP %{http_code}（404=端点已注册，商品不存在属预期）\n" \
              "http://127.0.0.1:$PORT/api/skills/999999/download" || true
            echo "==> 部署完成"
